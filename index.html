<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード印刷レイアウト</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --accent: #007aff;
    --border: #e5e5ea;
    --card-w: 59mm;
    --card-h: 86mm;
    --frame-w: 5px;
    --gap: 4mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .controls h1 {
    font-size: 18px;
    margin: 0;
    margin-right: auto;
  }
  .controls input[type="file"] { font-size: 14px; }
  .controls button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .controls .hint {
    font-size: 12px;
    color: var(--text-muted);
    width: 100%;
  }
  .size-groups {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .size-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .size-group-label {
    font-size: 11px;
    color: var(--text-muted);
  }
  .size-toggle {
    display: flex;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .size-toggle button {
    background: transparent;
    color: var(--text);
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 6px;
  }
  .size-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .fine-adjust {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
  }
  .fine-adjust label {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .fine-adjust input[type="number"] {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .fine-adjust input[type="number"]:disabled {
    background: var(--bg);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .fine-adjust-enable {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .frame-width-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
  }
  .frame-width-control input[type="range"] {
    width: 100px;
  }

  .page-wrap {
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  .page-scale {
    position: relative;
    overflow: hidden;
  }

  .page {
    background: #fff;
    width: 210mm;
    height: 297mm;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    display: grid;
  }

  .divider-v {
    grid-row: 1 / -1;
    width: 0;
    border-left: 1px dashed #999;
    justify-self: center;
  }
  .divider-h {
    grid-column: 1 / -1;
    height: 0;
    border-top: 1px dashed #999;
    align-self: center;
  }

  .cell {
    width: var(--card-w);
    height: var(--card-h);
    outline: double var(--frame-w) #000;
    outline-offset: 0;
    overflow: visible;
    position: relative;
    background: #fafafa;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .cell.dragover {
    background: #eaf3ff;
    box-shadow: inset 0 0 0 3px var(--accent);
  }
  .cell.empty-cell {
    cursor: pointer;
  }
  .cell.empty-cell:hover {
    background: #eef1f5;
  }
  .mark {
    position: absolute;
    width: 2mm;
    height: 2mm;
    pointer-events: none;
  }
  .mark-tl { top: -2mm; left: -2mm; border-bottom: 1px solid #000; border-right: 1px solid #000; }
  .mark-tr { top: -2mm; right: -2mm; border-bottom: 1px solid #000; border-left: 1px solid #000; }
  .mark-bl { bottom: -2mm; left: -2mm; border-top: 1px solid #000; border-right: 1px solid #000; }
  .mark-br { bottom: -2mm; right: -2mm; border-top: 1px solid #000; border-left: 1px solid #000; }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cell .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 100%;
    color: var(--text-muted);
    font-size: 11px;
    text-align: center;
    padding: 4px;
    pointer-events: none;
  }
  .cell .empty .num { font-size: 14px; }

  @media print {
    .controls { display: none; }
    .page-wrap { padding: 0; }
    .page-scale {
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
    }
    .page {
      position: static;
      transform: none !important;
      box-shadow: none;
      margin: 0;
    }
    @page {
      size: A4;
      margin: 0;
    }
  }

  /* 一部のモバイルブラウザは@media printを印刷出力に反映しないため、JSでも同じ内容を強制する */
  html.printing .controls { display: none; }
  html.printing .page-wrap { padding: 0; }
  html.printing .page-scale {
    width: auto !important;
    height: auto !important;
    overflow: visible !important;
  }
  html.printing .page {
    position: static;
    transform: none !important;
    box-shadow: none;
    margin: 0;
  }

  @media screen and (max-width: 700px) {
    .controls {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .controls h1 {
      margin-right: 0;
      text-align: center;
    }
    .size-groups {
      width: 100%;
      justify-content: center;
    }
    .size-group {
      align-items: center;
      flex: 1;
      min-width: 140px;
    }
    .size-toggle {
      justify-content: center;
      width: 100%;
    }
    .size-toggle button {
      flex: 1;
    }
    .frame-width-control {
      justify-content: center;
    }
    .frame-width-control input[type="range"] {
      flex: 1;
    }
    .controls input[type="file"] {
      width: 100%;
    }
    .controls button#print-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
    .page-wrap {
      padding: 12px;
    }
  }
</style>
</head>
<body>
  <div class="controls">
    <h1 id="title">カード印刷レイアウト (59mm×86mm / 3×3)</h1>
    <div class="size-groups">
      <div class="size-group">
        <span class="size-group-label">トレーディングカード(3×3)</span>
        <div class="size-toggle" data-group="card">
          <button type="button" data-w="59" data-h="86" class="active">59×86mm</button>
          <button type="button" data-w="63" data-h="88">63×88mm</button>
        </div>
      </div>
      <div class="size-group">
        <span class="size-group-label">スクエア(A4に最大枚数配置)</span>
        <div class="size-toggle" data-group="square">
          <button type="button" data-w="48" data-h="48">48×48mm</button>
          <button type="button" data-w="52" data-h="52">52×52mm</button>
        </div>
      </div>
    </div>
    <div class="fine-adjust" id="fine-adjust-section">
      <label class="fine-adjust-enable">
        <input type="checkbox" id="fine-adjust-enable">
        微調整
      </label>
      <label>幅 +<input type="number" id="fine-adjust-w" step="0.01" min="0" max="5" value="0" disabled> mm</label>
      <label>高さ +<input type="number" id="fine-adjust-h" step="0.01" min="0" max="5" value="0" disabled> mm</label>
    </div>
    <label class="frame-width-control">
      枠の太さ <span id="frame-w-label">5px</span>
      <input type="range" id="frame-w-input" min="1" max="10" step="1" value="5">
    </label>
    <input type="file" id="file-input" accept="image/*" multiple>
    <button id="print-btn">印刷</button>
    <span class="hint">上の選択で複数枚まとめて配置できます。空きマスはクリック、または画像をドラッグ&ドロップして個別に追加・差し替えできます。</span>
  </div>

  <div class="page-wrap">
    <div class="page-scale" id="page-scale">
      <div class="page" id="page"></div>
    </div>
  </div>
  <input type="file" id="cell-file-input" accept="image/*" style="display:none">

<script>
  const PAGE_W_MM = 210;
  const PAGE_H_MM = 297;
  const SAFE_MARGIN_MM = 3; // 印刷不可能領域対策の安全余白

  const fileInput = document.getElementById('file-input');
  const page = document.getElementById('page');
  const printBtn = document.getElementById('print-btn');
  const title = document.getElementById('title');
  const sizeButtons = document.querySelectorAll('.size-toggle button');
  const fineAdjustSection = document.getElementById('fine-adjust-section');

  const fineAdjustEnable = document.getElementById('fine-adjust-enable');
  const fineAdjustW = document.getElementById('fine-adjust-w');
  const fineAdjustH = document.getElementById('fine-adjust-h');

  // サイズごとの微調整デフォルト値(有効化した際にプリセットする値)
  const FINE_ADJUST_DEFAULTS = {
    '59-86': { w: 0.14, h: 0.6 },
  };

  function fineAdjustDefaultFor(btn) {
    return FINE_ADJUST_DEFAULTS[`${btn.dataset.w}-${btn.dataset.h}`] || { w: 0, h: 0 };
  }

  let gapMM = 4;

  // カードサイズ+ギャップ+安全余白から、A4に収まる最大の列数・行数を求める
  function computeAutoGrid(cardW, cardH) {
    const availW = PAGE_W_MM - SAFE_MARGIN_MM * 2;
    const availH = PAGE_H_MM - SAFE_MARGIN_MM * 2;
    const cols = Math.max(1, Math.floor((availW + gapMM) / (cardW + gapMM)));
    const rows = Math.max(1, Math.floor((availH + gapMM) / (cardH + gapMM)));
    return { cols, rows };
  }

  function getActiveTemplate() {
    const activeBtn = document.querySelector('.size-toggle button.active');
    const group = activeBtn.closest('.size-toggle').dataset.group;
    const baseW = parseFloat(activeBtn.dataset.w);
    const baseH = parseFloat(activeBtn.dataset.h);
    if (group === 'square') {
      const { cols, rows } = computeAutoGrid(baseW, baseH);
      return { activeBtn, group, cols, rows, baseW, baseH };
    }
    return { activeBtn, group, cols: 3, rows: 3, baseW, baseH };
  }

  function buildTrack(count, isRow) {
    const size = isRow ? 'var(--card-h)' : 'var(--card-w)';
    const parts = ['1fr'];
    for (let i = 0; i < count; i++) {
      parts.push(size);
      if (i < count - 1) parts.push('var(--gap)');
    }
    parts.push('1fr');
    return parts.join(' ');
  }

  function resizeCellImages(count) {
    const next = new Array(count).fill(null);
    for (let i = 0; i < Math.min(count, cellImages.length); i++) next[i] = cellImages[i];
    cellImages = next;
  }

  function applySize() {
    const tpl = getActiveTemplate();
    const isCard = tpl.group === 'card';
    fineAdjustSection.style.display = isCard ? '' : 'none';

    const adjW = (isCard && fineAdjustEnable.checked) ? (parseFloat(fineAdjustW.value) || 0) : 0;
    const adjH = (isCard && fineAdjustEnable.checked) ? (parseFloat(fineAdjustH.value) || 0) : 0;
    const w = (tpl.baseW + adjW).toFixed(2);
    const h = (tpl.baseH + adjH).toFixed(2);
    document.documentElement.style.setProperty('--card-w', `${w}mm`);
    document.documentElement.style.setProperty('--card-h', `${h}mm`);
    document.documentElement.style.setProperty('--gap', `${gapMM}mm`);

    page.style.gridTemplateColumns = buildTrack(tpl.cols, false);
    page.style.gridTemplateRows = buildTrack(tpl.rows, true);

    resizeCellImages(tpl.cols * tpl.rows);

    const countLabel = isCard ? '' : `, ${tpl.cols * tpl.rows}枚`;
    title.textContent = `カード印刷レイアウト (${w}mm×${h}mm / ${tpl.cols}×${tpl.rows}${countLabel})`;

    render();
  }

  sizeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      sizeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const def = fineAdjustDefaultFor(btn);
      fineAdjustW.value = def.w;
      fineAdjustH.value = def.h;
      applySize();
    });
  });

  fineAdjustEnable.addEventListener('change', () => {
    fineAdjustW.disabled = !fineAdjustEnable.checked;
    fineAdjustH.disabled = !fineAdjustEnable.checked;
    if (fineAdjustEnable.checked) {
      const activeBtn = document.querySelector('.size-toggle button.active');
      const def = fineAdjustDefaultFor(activeBtn);
      fineAdjustW.value = def.w;
      fineAdjustH.value = def.h;
    }
    applySize();
  });

  fineAdjustW.addEventListener('input', applySize);
  fineAdjustH.addEventListener('input', applySize);

  const frameWInput = document.getElementById('frame-w-input');
  const frameWLabel = document.getElementById('frame-w-label');
  frameWInput.addEventListener('input', () => {
    document.documentElement.style.setProperty('--frame-w', `${frameWInput.value}px`);
    frameWLabel.textContent = `${frameWInput.value}px`;
  });

  // スマホはA4指定通りに印刷できないことが多いため、枠と隙間を初期値だけ小さくする(PCはそのまま)
  if (window.matchMedia('(max-width: 700px)').matches) {
    document.documentElement.style.setProperty('--frame-w', '2px');
    gapMM = 2;
    frameWInput.value = 2;
    frameWLabel.textContent = '2px';
  }

  let cellImages = [];
  const cellFileInput = document.getElementById('cell-file-input');
  let cellFileTarget = null;

  function setCellImage(index, url) {
    cellImages[index] = url;
    render();
  }

  function imagesFromFiles(fileList) {
    return Array.from(fileList)
      .filter(f => f.type.startsWith('image/'))
      .map(f => URL.createObjectURL(f));
  }

  function render() {
    const tpl = getActiveTemplate();
    const cols = tpl.cols;
    const rows = tpl.rows;
    const cellCount = cols * rows;
    page.innerHTML = '';

    for (let c = 0; c < cols - 1; c++) {
      const divider = document.createElement('div');
      divider.className = 'divider-v';
      divider.style.gridColumn = String(2 * c + 3);
      page.appendChild(divider);
    }
    for (let r = 0; r < rows - 1; r++) {
      const divider = document.createElement('div');
      divider.className = 'divider-h';
      divider.style.gridRow = String(2 * r + 3);
      page.appendChild(divider);
    }

    for (let i = 0; i < cellCount; i++) {
      const row = Math.floor(i / cols);
      const col = i % cols;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridColumn = String(col * 2 + 2);
      cell.style.gridRow = String(row * 2 + 2);

      if (cellImages[i]) {
        const img = document.createElement('img');
        img.src = cellImages[i];
        cell.appendChild(img);
      } else {
        cell.classList.add('empty-cell');
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = `<span class="num">${i + 1}</span><span>クリック/ドロップ</span>`;
        cell.appendChild(empty);
        cell.addEventListener('click', () => {
          cellFileTarget = i;
          cellFileInput.click();
        });
      }

      for (const pos of ['tl', 'tr', 'bl', 'br']) {
        const mark = document.createElement('span');
        mark.className = `mark mark-${pos}`;
        cell.appendChild(mark);
      }

      cell.addEventListener('dragover', (e) => {
        e.preventDefault();
        cell.classList.add('dragover');
      });
      cell.addEventListener('dragleave', (e) => {
        if (cell.contains(e.relatedTarget)) return;
        cell.classList.remove('dragover');
      });
      cell.addEventListener('drop', (e) => {
        e.preventDefault();
        cell.classList.remove('dragover');
        const urls = imagesFromFiles(e.dataTransfer.files);
        if (urls.length > 0) setCellImage(i, urls[0]);
      });

      page.appendChild(cell);
    }
  }

  cellFileInput.addEventListener('change', () => {
    if (cellFileTarget === null) return;
    const urls = imagesFromFiles(cellFileInput.files);
    if (urls.length > 0) setCellImage(cellFileTarget, urls[0]);
    cellFileInput.value = '';
    cellFileTarget = null;
  });

  fileInput.addEventListener('change', () => {
    const urls = imagesFromFiles(fileInput.files);
    if (urls.length === 0) return;
    const count = cellImages.length;
    cellImages = urls.length === 1
      ? new Array(count).fill(urls[0])
      : new Array(count).fill(null).map((_, i) => urls[i] ?? null);
    render();
  });

  // カード以外の場所にドロップされてブラウザがファイルを開いてしまうのを防ぐ
  ['dragover', 'drop'].forEach(evt => {
    window.addEventListener(evt, (e) => e.preventDefault());
  });

  function setPrinting(isPrinting) {
    document.documentElement.classList.toggle('printing', isPrinting);
  }
  window.addEventListener('beforeprint', () => setPrinting(true));
  window.addEventListener('afterprint', () => setPrinting(false));
  const printMql = window.matchMedia('print');
  const onPrintChange = (e) => setPrinting(e.matches);
  printMql.addEventListener ? printMql.addEventListener('change', onPrintChange) : printMql.addListener(onPrintChange);

  printBtn.addEventListener('click', () => {
    setPrinting(true);
    window.print();
    setTimeout(() => setPrinting(false), 60000);
  });

  const pageScale = document.getElementById('page-scale');
  function updatePageScale() {
    const naturalWidth = page.offsetWidth;
    const naturalHeight = page.offsetHeight;
    const available = document.querySelector('.page-wrap').clientWidth - 24;
    const scale = Math.min(1, available / naturalWidth);
    page.style.transform = `scale(${scale})`;
    pageScale.style.width = `${naturalWidth * scale}px`;
    pageScale.style.height = `${naturalHeight * scale}px`;
  }
  window.addEventListener('resize', updatePageScale);

  applySize();
  updatePageScale();
</script>
</body>
</html>
