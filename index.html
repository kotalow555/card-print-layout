<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード印刷レイアウト</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --accent: #007aff;
    --border: #e5e5ea;
    --card-w: 59mm;
    --card-h: 86mm;
    --frame-w: 5px;
    --gap: 4mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .controls h1 {
    font-size: 18px;
    margin: 0;
    margin-right: auto;
  }
  .controls input[type="file"] { font-size: 14px; }
  .controls button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .controls .hint {
    font-size: 12px;
    color: var(--text-muted);
    width: 100%;
  }
  .size-toggle {
    display: flex;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .size-toggle button {
    background: transparent;
    color: var(--text);
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 6px;
  }
  .size-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .fine-adjust {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
  }
  .fine-adjust label {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .fine-adjust input[type="number"] {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .frame-width-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
  }
  .frame-width-control input[type="range"] {
    width: 100px;
  }

  .page-wrap {
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  .page-scale {
    position: relative;
    overflow: hidden;
  }

  .page {
    background: #fff;
    width: 210mm;
    height: 297mm;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    display: grid;
    grid-template-columns: 1fr var(--card-w) var(--gap) var(--card-w) var(--gap) var(--card-w) 1fr;
    grid-template-rows: 1fr var(--card-h) var(--gap) var(--card-h) var(--gap) var(--card-h) 1fr;
  }

  .divider-v {
    grid-row: 1 / -1;
    width: 0;
    border-left: 1px dashed #999;
    justify-self: center;
  }
  .divider-h {
    grid-column: 1 / -1;
    height: 0;
    border-top: 1px dashed #999;
    align-self: center;
  }

  .cell {
    width: var(--card-w);
    height: var(--card-h);
    outline: double var(--frame-w) #000;
    outline-offset: 0;
    overflow: visible;
    position: relative;
    background: #fafafa;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .cell.dragover {
    background: #eaf3ff;
    box-shadow: inset 0 0 0 3px var(--accent);
  }
  .cell.empty-cell {
    cursor: pointer;
  }
  .cell.empty-cell:hover {
    background: #eef1f5;
  }
  .mark {
    position: absolute;
    width: 2mm;
    height: 2mm;
    pointer-events: none;
  }
  .mark-tl { top: -2mm; left: -2mm; border-bottom: 1px solid #000; border-right: 1px solid #000; }
  .mark-tr { top: -2mm; right: -2mm; border-bottom: 1px solid #000; border-left: 1px solid #000; }
  .mark-bl { bottom: -2mm; left: -2mm; border-top: 1px solid #000; border-right: 1px solid #000; }
  .mark-br { bottom: -2mm; right: -2mm; border-top: 1px solid #000; border-left: 1px solid #000; }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cell .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 100%;
    color: var(--text-muted);
    font-size: 11px;
    text-align: center;
    padding: 4px;
    pointer-events: none;
  }
  .cell .empty .num { font-size: 14px; }

  @media print {
    .controls { display: none; }
    .page-wrap { padding: 0; }
    .page-scale {
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
    }
    .page {
      position: static;
      transform: none !important;
      box-shadow: none;
      margin: 0;
    }
    @page {
      size: A4;
      margin: 0;
    }
  }

  @media (max-width: 700px) {
    .controls {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .controls h1 {
      margin-right: 0;
      text-align: center;
    }
    .size-toggle {
      justify-content: center;
    }
    .size-toggle button {
      flex: 1;
    }
    .frame-width-control {
      justify-content: center;
    }
    .frame-width-control input[type="range"] {
      flex: 1;
    }
    .controls input[type="file"] {
      width: 100%;
    }
    .controls button#print-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
    .page-wrap {
      padding: 12px;
    }
  }
</style>
</head>
<body>
  <div class="controls">
    <h1 id="title">カード印刷レイアウト (59mm×86mm / 3×3)</h1>
    <div class="size-toggle">
      <button type="button" data-w="59" data-h="86" class="active">59×86mm</button>
      <button type="button" data-w="63" data-h="88">63×88mm</button>
    </div>
    <div class="fine-adjust">
      <span>微調整:</span>
      <label>幅 +<input type="number" id="fine-adjust-w" step="0.1" min="0" max="5" value="0"> mm</label>
      <label>高さ +<input type="number" id="fine-adjust-h" step="0.1" min="0" max="5" value="0"> mm</label>
    </div>
    <label class="frame-width-control">
      枠の太さ <span id="frame-w-label">5px</span>
      <input type="range" id="frame-w-input" min="1" max="10" step="1" value="5">
    </label>
    <input type="file" id="file-input" accept="image/*" multiple>
    <button id="print-btn">印刷</button>
    <span class="hint">上の選択で複数枚まとめて配置できます。空きマスはクリック、または画像をドラッグ&ドロップして個別に追加・差し替えできます。</span>
  </div>

  <div class="page-wrap">
    <div class="page-scale" id="page-scale">
      <div class="page" id="page"></div>
    </div>
  </div>
  <input type="file" id="cell-file-input" accept="image/*" style="display:none">

<script>
  const CELL_COUNT = 9;
  const fileInput = document.getElementById('file-input');
  const page = document.getElementById('page');
  const printBtn = document.getElementById('print-btn');
  const title = document.getElementById('title');
  const sizeButtons = document.querySelectorAll('.size-toggle button');

  const fineAdjustW = document.getElementById('fine-adjust-w');
  const fineAdjustH = document.getElementById('fine-adjust-h');

  function applySize() {
    const activeBtn = document.querySelector('.size-toggle button.active');
    const adjW = parseFloat(fineAdjustW.value) || 0;
    const adjH = parseFloat(fineAdjustH.value) || 0;
    const w = (parseFloat(activeBtn.dataset.w) + adjW).toFixed(1);
    const h = (parseFloat(activeBtn.dataset.h) + adjH).toFixed(1);
    document.documentElement.style.setProperty('--card-w', `${w}mm`);
    document.documentElement.style.setProperty('--card-h', `${h}mm`);
    title.textContent = `カード印刷レイアウト (${w}mm×${h}mm / 3×3)`;
  }

  sizeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      sizeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fineAdjustW.value = 0;
      fineAdjustH.value = 0;
      applySize();
    });
  });

  fineAdjustW.addEventListener('input', applySize);
  fineAdjustH.addEventListener('input', applySize);

  const frameWInput = document.getElementById('frame-w-input');
  const frameWLabel = document.getElementById('frame-w-label');
  frameWInput.addEventListener('input', () => {
    document.documentElement.style.setProperty('--frame-w', `${frameWInput.value}px`);
    frameWLabel.textContent = `${frameWInput.value}px`;
  });

  // スマホはA4指定通りに印刷できないことが多いため、枠と隙間を初期値だけ小さくする(PCはそのまま)
  if (window.matchMedia('(max-width: 700px)').matches) {
    document.documentElement.style.setProperty('--frame-w', '2px');
    document.documentElement.style.setProperty('--gap', '2mm');
    frameWInput.value = 2;
    frameWLabel.textContent = '2px';
  }

  let cellImages = new Array(CELL_COUNT).fill(null);
  const cellFileInput = document.getElementById('cell-file-input');
  let cellFileTarget = null;

  function setCellImage(index, url) {
    cellImages[index] = url;
    render();
  }

  function imagesFromFiles(fileList) {
    return Array.from(fileList)
      .filter(f => f.type.startsWith('image/'))
      .map(f => URL.createObjectURL(f));
  }

  function render() {
    page.innerHTML = '';

    for (const col of [3, 5]) {
      const divider = document.createElement('div');
      divider.className = 'divider-v';
      divider.style.gridColumn = String(col);
      page.appendChild(divider);
    }
    for (const row of [3, 5]) {
      const divider = document.createElement('div');
      divider.className = 'divider-h';
      divider.style.gridRow = String(row);
      page.appendChild(divider);
    }

    for (let i = 0; i < CELL_COUNT; i++) {
      const row = Math.floor(i / 3);
      const col = i % 3;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridColumn = String(col * 2 + 2);
      cell.style.gridRow = String(row * 2 + 2);

      if (cellImages[i]) {
        const img = document.createElement('img');
        img.src = cellImages[i];
        cell.appendChild(img);
      } else {
        cell.classList.add('empty-cell');
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = `<span class="num">${i + 1}</span><span>クリック/ドロップ</span>`;
        cell.appendChild(empty);
        cell.addEventListener('click', () => {
          cellFileTarget = i;
          cellFileInput.click();
        });
      }

      for (const pos of ['tl', 'tr', 'bl', 'br']) {
        const mark = document.createElement('span');
        mark.className = `mark mark-${pos}`;
        cell.appendChild(mark);
      }

      cell.addEventListener('dragover', (e) => {
        e.preventDefault();
        cell.classList.add('dragover');
      });
      cell.addEventListener('dragleave', (e) => {
        if (cell.contains(e.relatedTarget)) return;
        cell.classList.remove('dragover');
      });
      cell.addEventListener('drop', (e) => {
        e.preventDefault();
        cell.classList.remove('dragover');
        const urls = imagesFromFiles(e.dataTransfer.files);
        if (urls.length > 0) setCellImage(i, urls[0]);
      });

      page.appendChild(cell);
    }
  }

  cellFileInput.addEventListener('change', () => {
    if (cellFileTarget === null) return;
    const urls = imagesFromFiles(cellFileInput.files);
    if (urls.length > 0) setCellImage(cellFileTarget, urls[0]);
    cellFileInput.value = '';
    cellFileTarget = null;
  });

  fileInput.addEventListener('change', () => {
    const urls = imagesFromFiles(fileInput.files);
    if (urls.length === 0) return;
    cellImages = urls.length === 1
      ? new Array(CELL_COUNT).fill(urls[0])
      : new Array(CELL_COUNT).fill(null).map((_, i) => urls[i] ?? null);
    render();
  });

  // カード以外の場所にドロップされてブラウザがファイルを開いてしまうのを防ぐ
  ['dragover', 'drop'].forEach(evt => {
    window.addEventListener(evt, (e) => e.preventDefault());
  });

  printBtn.addEventListener('click', () => window.print());

  const pageScale = document.getElementById('page-scale');
  function updatePageScale() {
    const naturalWidth = page.offsetWidth;
    const naturalHeight = page.offsetHeight;
    const available = document.querySelector('.page-wrap').clientWidth - 24;
    const scale = Math.min(1, available / naturalWidth);
    page.style.transform = `scale(${scale})`;
    pageScale.style.width = `${naturalWidth * scale}px`;
    pageScale.style.height = `${naturalHeight * scale}px`;
  }
  window.addEventListener('resize', updatePageScale);

  render();
  updatePageScale();
</script>
</body>
</html>
