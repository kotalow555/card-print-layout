<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード印刷レイアウト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --accent: #007aff;
    --border: #e5e5ea;
    --card-w: 59mm;
    --card-h: 86mm;
    --frame-w: 4px;
    --col-gap: 4mm;
    --row-gap: 4mm;
    --mark-size: 2mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .controls-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .controls-header h1 {
    font-size: 18px;
    margin: 0;
  }
  .controls-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .controls input[type="file"] { font-size: 14px; }
  .controls button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .controls button:disabled {
    background: var(--text-muted);
    cursor: default;
  }
  .settings-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .controls .hint {
    font-size: 12px;
    color: var(--text-muted);
  }
  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
  }
  .ctrl-group-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .size-toggle {
    display: flex;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .size-toggle button {
    background: transparent;
    color: var(--text);
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 6px;
  }
  .size-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .fine-adjust {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
  }
  .fine-adjust label {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .fine-adjust input[type="number"] {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .fine-adjust input[type="number"]:disabled {
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .fine-adjust-enable {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .frame-width-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
  }
  .frame-width-control input[type="range"] {
    width: 100px;
  }

  .page-wrap {
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  .page-scale {
    position: relative;
    overflow: hidden;
  }

  .page {
    background: #fff;
    width: 210mm;
    height: 297mm;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    display: grid;
  }

  .divider-v {
    grid-row: 1 / -1;
    width: 0;
    border-left: 1px dashed #999;
    justify-self: center;
  }
  .divider-h {
    grid-column: 1 / -1;
    height: 0;
    border-top: 1px dashed #999;
    align-self: center;
  }

  .cell {
    width: var(--card-w);
    height: var(--card-h);
    outline: double var(--frame-w) #000;
    outline-offset: 0;
    overflow: visible;
    position: relative;
    background: #fafafa;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .cell.dragover {
    background: #eaf3ff;
    box-shadow: inset 0 0 0 3px var(--accent);
  }
  .cell.empty-cell {
    cursor: pointer;
  }
  .cell.empty-cell:hover {
    background: #eef1f5;
  }
  .mark {
    position: absolute;
    width: var(--mark-size);
    height: var(--mark-size);
    pointer-events: none;
  }
  .mark-tl { top: calc(-1 * var(--mark-size)); left: calc(-1 * var(--mark-size)); border-bottom: 1px solid #000; border-right: 1px solid #000; }
  .mark-tr { top: calc(-1 * var(--mark-size)); right: calc(-1 * var(--mark-size)); border-bottom: 1px solid #000; border-left: 1px solid #000; }
  .mark-bl { bottom: calc(-1 * var(--mark-size)); left: calc(-1 * var(--mark-size)); border-top: 1px solid #000; border-right: 1px solid #000; }
  .mark-br { bottom: calc(-1 * var(--mark-size)); right: calc(-1 * var(--mark-size)); border-top: 1px solid #000; border-left: 1px solid #000; }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cell .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 100%;
    color: var(--text-muted);
    font-size: 11px;
    text-align: center;
    padding: 4px;
    pointer-events: none;
  }
  .cell .empty .num { font-size: 14px; }

  @media print {
    .controls { display: none; }
    .page-wrap { padding: 0; }
    .page-scale {
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
    }
    .page {
      position: static;
      transform: none !important;
      box-shadow: none;
      margin: 0;
    }
    @page {
      size: A4;
      margin: 0;
    }
  }

  /* 一部のモバイルブラウザは@media printを印刷出力に反映しないため、JSでも同じ内容を強制する */
  html.printing .controls { display: none; }
  html.printing .page-wrap { padding: 0; }
  html.printing .page-scale {
    width: auto !important;
    height: auto !important;
    overflow: visible !important;
  }
  html.printing .page {
    position: static;
    transform: none !important;
    box-shadow: none;
    margin: 0;
  }

  @media screen and (max-width: 700px) {
    .controls {
      gap: 10px;
    }
    .controls-header {
      flex-direction: column;
      align-items: stretch;
    }
    .controls-header h1 {
      text-align: center;
    }
    .controls-actions {
      flex-direction: column;
      align-items: stretch;
    }
    .ctrl-group {
      width: 100%;
      align-items: center;
    }
    .size-toggle {
      justify-content: center;
      width: 100%;
    }
    .size-toggle button {
      flex: 1;
    }
    .fine-adjust {
      justify-content: center;
      flex-wrap: wrap;
    }
    .frame-width-control {
      justify-content: center;
      width: 100%;
    }
    .frame-width-control input[type="range"] {
      flex: 1;
    }
    .controls input[type="file"] {
      width: 100%;
    }
    .controls button#print-btn,
    .controls button#save-images-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
    .page-wrap {
      padding: 12px;
    }
  }
</style>
</head>
<body>
  <div class="controls">
    <div class="controls-header">
      <h1 id="title">カード印刷レイアウト (59mm×86mm / 3×3, 9枚)</h1>
      <div class="controls-actions">
        <input type="file" id="file-input" accept="image/*" multiple>
        <button id="save-images-btn" type="button">画像を保存</button>
        <button id="print-btn">印刷</button>
      </div>
    </div>
    <div class="settings-row">
      <div class="ctrl-group">
        <span class="ctrl-group-label">トレーディングカード(3×3)</span>
        <div class="size-toggle" data-group="card">
          <button type="button" data-w="59" data-h="86" class="active">59×86mm</button>
          <button type="button" data-w="63" data-h="88">63×88mm</button>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-group-label">シール(A4に最大枚数配置)</span>
        <div class="size-toggle" data-group="square">
          <button type="button" data-w="48" data-h="48">48×48mm</button>
          <button type="button" data-w="52" data-h="52">52×52mm</button>
        </div>
      </div>
      <div class="ctrl-group" id="fine-adjust-section">
        <span class="ctrl-group-label">微調整</span>
        <div class="fine-adjust">
          <label class="fine-adjust-enable">
            <input type="checkbox" id="fine-adjust-enable">
            有効にする
          </label>
          <label>幅 +<input type="number" id="fine-adjust-w" step="0.01" min="0" max="5" value="0" disabled> mm</label>
          <label>高さ +<input type="number" id="fine-adjust-h" step="0.01" min="0" max="5" value="0" disabled> mm</label>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-group-label">枠の太さ</span>
        <label class="frame-width-control">
          <span id="frame-w-label">4px</span>
          <input type="range" id="frame-w-input" min="1" max="10" step="1" value="4">
        </label>
      </div>
    </div>
    <span class="hint">上の選択で複数枚まとめて配置できます。空きマスはクリック、または画像をドラッグ&ドロップして個別に追加・差し替えできます。</span>
  </div>

  <div class="page-wrap">
    <div class="page-scale" id="page-scale">
      <div class="page" id="page"></div>
    </div>
  </div>
  <input type="file" id="cell-file-input" accept="image/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
  const PAGE_W_MM = 210;
  const PAGE_H_MM = 297;
  const SAFE_MARGIN_MM = 3; // 印刷不可能領域対策の安全余白

  const fileInput = document.getElementById('file-input');
  const page = document.getElementById('page');
  const printBtn = document.getElementById('print-btn');
  const saveImagesBtn = document.getElementById('save-images-btn');
  const title = document.getElementById('title');
  const sizeButtons = document.querySelectorAll('.size-toggle button');

  const fineAdjustEnable = document.getElementById('fine-adjust-enable');
  const fineAdjustW = document.getElementById('fine-adjust-w');
  const fineAdjustH = document.getElementById('fine-adjust-h');

  // 微調整の初期オフセットは基準サイズに対する倍率から算出する(59mmを+0.15mm、86mmを+0.9mmとする比率)
  const FINE_ADJUST_DEFAULT_SCALE = { w: 1 + 0.15 / 59, h: 1 + 0.9 / 86 };

  function fineAdjustDefaultFor(btn) {
    const baseW = parseFloat(btn.dataset.w);
    const baseH = parseFloat(btn.dataset.h);
    const w = Math.round(baseW * (FINE_ADJUST_DEFAULT_SCALE.w - 1) * 100) / 100;
    const h = Math.round(baseH * (FINE_ADJUST_DEFAULT_SCALE.h - 1) * 100) / 100;
    return { w, h };
  }

  // グループごとの枠の太さデフォルト値
  const FRAME_W_DEFAULTS = { card: 4, square: 1 };

  let gapMM = 4;
  const SQUARE_GAP_MM = 2; // 実機印刷での見切れを避けるため、外側マージンを優先して狭めに固定

  // カードサイズ+ギャップ+安全余白から、A4に収まる最大の列数・行数を求める
  function computeAutoGrid(cardW, cardH) {
    const availW = PAGE_W_MM - SAFE_MARGIN_MM * 2;
    const availH = PAGE_H_MM - SAFE_MARGIN_MM * 2;
    const cols = Math.max(1, Math.floor((availW + SQUARE_GAP_MM) / (cardW + SQUARE_GAP_MM)));
    const rows = Math.max(1, Math.floor((availH + SQUARE_GAP_MM) / (cardH + SQUARE_GAP_MM)));
    return { cols, rows };
  }

  // 軸ごとにギャップをGAP_MAXまで広げてみて、印刷の安全マージンを追加で確保できる場合だけ採用する
  function computeSquareGaps(cardW, cardH, cols, rows) {
    const availW = PAGE_W_MM - SAFE_MARGIN_MM * 2;
    const availH = PAGE_H_MM - SAFE_MARGIN_MM * 2;
    const GAP_MAX = 4; // 開きすぎて安全マージンを食わないよう上限をトレーディングカードと同じにする
    const MIN_EXTRA_MARGIN_MM = 3; // SAFE_MARGIN_MMに加えて左右/上下に最低限残したい余白

    function axisGap(count, size, avail) {
      if (count <= 1) return GAP_MAX;
      const maxFeasible = (avail - count * size) / (count - 1);
      const candidate = Math.min(GAP_MAX, maxFeasible);
      const leftoverAtCandidate = avail - (count * size + (count - 1) * candidate);
      return leftoverAtCandidate >= MIN_EXTRA_MARGIN_MM * 2 ? candidate : SQUARE_GAP_MM;
    }

    return {
      colGap: axisGap(cols, cardW, availW),
      rowGap: axisGap(rows, cardH, availH),
    };
  }

  function getActiveTemplate() {
    const activeBtn = document.querySelector('.size-toggle button.active');
    const group = activeBtn.closest('.size-toggle').dataset.group;
    const baseW = parseFloat(activeBtn.dataset.w);
    const baseH = parseFloat(activeBtn.dataset.h);
    const adjW = fineAdjustEnable.checked ? (parseFloat(fineAdjustW.value) || 0) : 0;
    const adjH = fineAdjustEnable.checked ? (parseFloat(fineAdjustH.value) || 0) : 0;
    const w = baseW + adjW;
    const h = baseH + adjH;

    if (group === 'square') {
      const { cols, rows } = computeAutoGrid(w, h);
      const { colGap, rowGap } = computeSquareGaps(w, h, cols, rows);
      return { activeBtn, group, cols, rows, w, h, colGap, rowGap };
    }
    return { activeBtn, group, cols: 3, rows: 3, w, h, colGap: gapMM, rowGap: gapMM };
  }

  function buildTrack(count, isRow) {
    const size = isRow ? 'var(--card-h)' : 'var(--card-w)';
    const gapVar = isRow ? 'var(--row-gap)' : 'var(--col-gap)';
    const parts = ['1fr'];
    for (let i = 0; i < count; i++) {
      parts.push(size);
      if (i < count - 1) parts.push(gapVar);
    }
    parts.push('1fr');
    return parts.join(' ');
  }

  function resizeCellImages(count) {
    const next = new Array(count).fill(null);
    for (let i = 0; i < Math.min(count, cellImages.length); i++) next[i] = cellImages[i];
    cellImages = next;
  }

  // タイトル表示用に末尾の0を省略する(59.00 -> "59", 59.14 -> "59.14")
  function formatMM(value) {
    return parseFloat(value.toFixed(2)).toString();
  }

  function applySize() {
    const tpl = getActiveTemplate();
    const w = tpl.w.toFixed(2);
    const h = tpl.h.toFixed(2);
    document.documentElement.style.setProperty('--card-w', `${w}mm`);
    document.documentElement.style.setProperty('--card-h', `${h}mm`);
    document.documentElement.style.setProperty('--col-gap', `${tpl.colGap.toFixed(2)}mm`);
    document.documentElement.style.setProperty('--row-gap', `${tpl.rowGap.toFixed(2)}mm`);
    // 隣接セルのカドマーク同士が重ならないよう、狭い方のギャップの半分を上限にする
    const markSize = Math.min(2, tpl.colGap / 2, tpl.rowGap / 2);
    document.documentElement.style.setProperty('--mark-size', `${markSize.toFixed(2)}mm`);

    page.style.gridTemplateColumns = buildTrack(tpl.cols, false);
    page.style.gridTemplateRows = buildTrack(tpl.rows, true);

    resizeCellImages(tpl.cols * tpl.rows);

    const count = tpl.cols * tpl.rows;
    title.textContent = `カード印刷レイアウト (${formatMM(tpl.w)}mm×${formatMM(tpl.h)}mm / ${tpl.cols}×${tpl.rows}, ${count}枚)`;

    render();
  }

  sizeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      sizeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const def = fineAdjustDefaultFor(btn);
      fineAdjustW.value = def.w;
      fineAdjustH.value = def.h;
      const group = btn.closest('.size-toggle').dataset.group;
      const frameW = FRAME_W_DEFAULTS[group];
      frameWInput.value = frameW;
      frameWLabel.textContent = `${frameW}px`;
      document.documentElement.style.setProperty('--frame-w', `${frameW}px`);
      applySize();
    });
  });

  fineAdjustEnable.addEventListener('change', () => {
    fineAdjustW.disabled = !fineAdjustEnable.checked;
    fineAdjustH.disabled = !fineAdjustEnable.checked;
    if (fineAdjustEnable.checked) {
      const activeBtn = document.querySelector('.size-toggle button.active');
      const def = fineAdjustDefaultFor(activeBtn);
      fineAdjustW.value = def.w;
      fineAdjustH.value = def.h;
    }
    applySize();
  });

  fineAdjustW.addEventListener('input', applySize);
  fineAdjustH.addEventListener('input', applySize);

  const frameWInput = document.getElementById('frame-w-input');
  const frameWLabel = document.getElementById('frame-w-label');
  frameWInput.addEventListener('input', () => {
    document.documentElement.style.setProperty('--frame-w', `${frameWInput.value}px`);
    frameWLabel.textContent = `${frameWInput.value}px`;
  });

  // スマホはA4指定通りに印刷できないことが多いため、トレーディングカードの隙間を初期値だけ小さくする(PCはそのまま)
  if (window.matchMedia('(max-width: 700px)').matches) {
    gapMM = 2;
  }

  let cellImages = [];
  const cellFileInput = document.getElementById('cell-file-input');
  let cellFileTarget = null;

  function setCellImage(index, url) {
    cellImages[index] = url;
    render();
  }

  function imagesFromFiles(fileList) {
    return Array.from(fileList)
      .filter(f => f.type.startsWith('image/'))
      .map(f => URL.createObjectURL(f));
  }

  function render() {
    const tpl = getActiveTemplate();
    const cols = tpl.cols;
    const rows = tpl.rows;
    const cellCount = cols * rows;
    page.innerHTML = '';

    for (let c = 0; c < cols - 1; c++) {
      const divider = document.createElement('div');
      divider.className = 'divider-v';
      divider.style.gridColumn = String(2 * c + 3);
      page.appendChild(divider);
    }
    for (let r = 0; r < rows - 1; r++) {
      const divider = document.createElement('div');
      divider.className = 'divider-h';
      divider.style.gridRow = String(2 * r + 3);
      page.appendChild(divider);
    }

    for (let i = 0; i < cellCount; i++) {
      const row = Math.floor(i / cols);
      const col = i % cols;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridColumn = String(col * 2 + 2);
      cell.style.gridRow = String(row * 2 + 2);

      if (cellImages[i]) {
        const img = document.createElement('img');
        img.src = cellImages[i];
        cell.appendChild(img);
      } else {
        cell.classList.add('empty-cell');
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = `<span class="num">${i + 1}</span><span>クリック/ドロップ</span>`;
        cell.appendChild(empty);
        cell.addEventListener('click', () => {
          cellFileTarget = i;
          cellFileInput.click();
        });
      }

      for (const pos of ['tl', 'tr', 'bl', 'br']) {
        const mark = document.createElement('span');
        mark.className = `mark mark-${pos}`;
        cell.appendChild(mark);
      }

      cell.addEventListener('dragover', (e) => {
        e.preventDefault();
        cell.classList.add('dragover');
      });
      cell.addEventListener('dragleave', (e) => {
        if (cell.contains(e.relatedTarget)) return;
        cell.classList.remove('dragover');
      });
      cell.addEventListener('drop', (e) => {
        e.preventDefault();
        cell.classList.remove('dragover');
        const urls = imagesFromFiles(e.dataTransfer.files);
        if (urls.length > 0) setCellImage(i, urls[0]);
      });

      page.appendChild(cell);
    }
  }

  cellFileInput.addEventListener('change', () => {
    if (cellFileTarget === null) return;
    const urls = imagesFromFiles(cellFileInput.files);
    if (urls.length > 0) setCellImage(cellFileTarget, urls[0]);
    cellFileInput.value = '';
    cellFileTarget = null;
  });

  fileInput.addEventListener('change', () => {
    const urls = imagesFromFiles(fileInput.files);
    if (urls.length === 0) return;
    const count = cellImages.length;
    cellImages = urls.length === 1
      ? new Array(count).fill(urls[0])
      : new Array(count).fill(null).map((_, i) => urls[i] ?? null);
    render();
  });

  // カード以外の場所にドロップされてブラウザがファイルを開いてしまうのを防ぐ
  ['dragover', 'drop'].forEach(evt => {
    window.addEventListener(evt, (e) => e.preventDefault());
  });

  // 配置済みの画像をZIPにまとめてダウンロードする(マス番号をファイル名にする)
  saveImagesBtn.addEventListener('click', async () => {
    const placed = cellImages
      .map((url, i) => ({ url, i }))
      .filter(entry => entry.url);
    if (placed.length === 0) {
      alert('保存する画像がありません。');
      return;
    }

    const originalLabel = saveImagesBtn.textContent;
    saveImagesBtn.disabled = true;
    saveImagesBtn.textContent = '保存中...';
    try {
      const zip = new JSZip();
      const digits = String(cellImages.length).length;
      await Promise.all(placed.map(async ({ url, i }) => {
        const blob = await (await fetch(url)).blob();
        const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
        zip.file(`${String(i + 1).padStart(digits, '0')}.${ext}`, blob);
      }));
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const zipUrl = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = zipUrl;
      a.download = `card-images_${formatPrintTimestamp(new Date())}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(zipUrl);
    } finally {
      saveImagesBtn.disabled = false;
      saveImagesBtn.textContent = originalLabel;
    }
  });

  // 印刷/PDF保存時のファイル名候補に使われるdocument.titleを、印刷中だけ日時にする
  const baseDocTitle = document.title;
  function formatPrintTimestamp(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
  }

  function setPrinting(isPrinting) {
    document.documentElement.classList.toggle('printing', isPrinting);
    document.title = isPrinting ? formatPrintTimestamp(new Date()) : baseDocTitle;
  }
  window.addEventListener('beforeprint', () => setPrinting(true));
  window.addEventListener('afterprint', () => setPrinting(false));
  const printMql = window.matchMedia('print');
  const onPrintChange = (e) => setPrinting(e.matches);
  printMql.addEventListener ? printMql.addEventListener('change', onPrintChange) : printMql.addListener(onPrintChange);

  printBtn.addEventListener('click', () => {
    setPrinting(true);
    window.print();
    setTimeout(() => setPrinting(false), 60000);
  });

  const pageScale = document.getElementById('page-scale');
  function updatePageScale() {
    const naturalWidth = page.offsetWidth;
    const naturalHeight = page.offsetHeight;
    const available = document.querySelector('.page-wrap').clientWidth - 24;
    const scale = Math.min(1, available / naturalWidth);
    page.style.transform = `scale(${scale})`;
    pageScale.style.width = `${naturalWidth * scale}px`;
    pageScale.style.height = `${naturalHeight * scale}px`;
  }
  window.addEventListener('resize', updatePageScale);

  applySize();
  updatePageScale();
</script>
</body>
